<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueMoney System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 380px;
            padding: 30px;
            background: #151515;
            border-radius: 20px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>TrueMoney</h1>
        <p>ระบบรับเงิน</p>

        <input
            type="text"
            placeholder="ใส่ลิงก์ซอง TrueMoney"
        >

        <button>รับซอง</button>
    </div>

</body>
</html>
