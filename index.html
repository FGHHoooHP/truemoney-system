<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrueMoney System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090909;
            font-family: Arial, sans-serif;
            color: white;
        }

        .box {
            width: 420px;
            padding: 30px;
            background: #151515;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(255, 120, 0, 0.15);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        p {
            text-align: center;
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #333;
            border-radius: 10px;
            outline: none;
            background: #0d0d0d;
            color: white;
            margin-top: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 0;
            border-radius: 10px;
            background: #ff7900;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            margin-top: 15px;
            text-align: center;
            color: #00ff88;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>TrueMoney</h1>

    <p>กรอกลิงก์ซองของคุณ</p>

    <input
        id="voucher"
        type="text"
        placeholder="https://gift.truemoney.com/..."
    >

    <button onclick="receiveVoucher()">
        รับเงิน
    </button>

    <div id="result"></div>

</div>

<script>

async function receiveVoucher() {

    const voucher = document.getElementById("voucher").value.trim();
    const result = document.getElementById("result");

    if (!voucher) {
        result.style.color = "#ff4444";
        result.textContent = "กรุณาใส่ลิงก์ซองก่อน";
        return;
    }

    result.style.color = "#ffaa00";
    result.textContent = "กำลังส่งข้อมูล...";

    try {

        const response = await fetch(
            "https://truemoney-system-production.up.railway.app/api/voucher",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    voucher: voucher
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            result.style.color = "#00ff88";
            result.textContent = data.message;

        } else {

            result.style.color = "#ff4444";
            result.textContent = data.message || "เกิดข้อผิดพลาด";

        }

    } catch (error) {

        console.error(error);

        result.style.color = "#ff4444";
        result.textContent = "เชื่อมต่อ Backend ไม่สำเร็จ";

    }
}

</script>

</body>
</html>
