<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueMoney System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090909;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 420px;
            padding: 35px;
            background: #141414;
            border: 1px solid #292929;
            border-radius: 22px;
        }

        h1 {
            text-align: center;
            margin: 0;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin: 10px 0 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #0d0d0d;
            color: white;
            border: 1px solid #333;
            border-radius: 12px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        #status {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #202020;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>TrueMoney</h1>

        <div class="subtitle">
            ระบบรับเงิน
        </div>

        <input
            id="voucher"
            type="text"
            placeholder="ใส่ลิงก์ซอง TrueMoney"
        >

        <button onclick="receiveVoucher()">
            รับซอง
        </button>

        <div id="status"></div>

    </div>

    <script>

        async function receiveVoucher() {

            const input = document.getElementById("voucher");
            const status = document.getElementById("status");

            const voucher = input.value.trim();

            status.style.display = "block";

            if (!voucher) {
                status.textContent = "กรุณาใส่ลิงก์ซองก่อน";
                return;
            }

            try {

                status.textContent = "กำลังส่งข้อมูล...";

                const response = await fetch(
                    "https://truemoney-system-production.up.railway.app/api/voucher",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            voucher: voucher
                        })
                    }
                );

                const data = await response.json();

                status.textContent = data.message;

            } catch (error) {

                status.textContent =
                    "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้";

                console.error(error);
            }
        }

    </script>

</body>
</html>
