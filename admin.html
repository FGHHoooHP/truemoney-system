<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 9px 14px;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

.logout {
    background: #e53935;
}

.refresh {
    background: #333;
    margin-left: 8px;
}

.verify {
    background: #00a854;
}

.reject {
    background: #d32f2f;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #111;
    border-radius: 14px;
    overflow: hidden;
}

th,
td {
    padding: 14px;
    border-bottom: 1px solid #222;
    text-align: left;
}

th {
    background: #181818;
}

.status {
    font-weight: bold;
}

.pending {
    color: #ffc107;
}

.verified {
    color: #00e676;
}

.rejected {
    color: #ff5252;
}

.actions {
    display: flex;
    gap: 7px;
}

.empty {
    text-align: center;
    padding: 25px;
}

</style>
</head>

<body>

<div class="header">

    <h1>Admin Panel</h1>

    <div>
        <button class="refresh" onclick="loadVouchers()">
            Refresh
        </button>

        <button class="logout" onclick="logout()">
            Logout
        </button>
    </div>

</div>

<table>

<thead>
<tr>
    <th>ID</th>
    <th>Voucher</th>
    <th>Status</th>
    <th>Date</th>
    <th>Action</th>
</tr>
</thead>

<tbody id="list">

<tr>
    <td colspan="5" class="empty">
        กำลังโหลด...
    </td>
</tr>

</tbody>

</table>

<script>

const API =
"https://truemoney-system-production.up.railway.app";

const token =
localStorage.getItem("adminToken");

if (!token) {
    window.location.href = "admin-login.html";
}

async function loadVouchers() {

    const list =
        document.getElementById("list");

    try {

        const response = await fetch(
            `${API}/api/admin/vouchers`,
            {
                headers: {
                    "x-admin-token": token
                }
            }
        );

        if (response.status === 401) {

            localStorage.removeItem("adminToken");

            window.location.href =
                "admin-login.html";

            return;
        }

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        if (
            !data.success ||
            !Array.isArray(data.vouchers)
        ) {
            throw new Error(
                data.message ||
                "รูปแบบข้อมูลไม่ถูกต้อง"
            );
        }

        list.replaceChildren();

        if (data.vouchers.length === 0) {

            list.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        ยังไม่มีรายการ
                    </td>
                </tr>
            `;

            return;
        }

        data.vouchers.forEach(item => {

            const row =
                document.createElement("tr");

            const id =
                document.createElement("td");

            id.textContent =
                item.id;

            const voucher =
                document.createElement("td");

            voucher.textContent =
                item.voucher;

            const status =
                document.createElement("td");

            status.textContent =
                item.status;

            status.className =
                `status ${item.status}`;

            const date =
                document.createElement("td");

            date.textContent =
                item.created_at;

            const actions =
                document.createElement("td");

            actions.className =
                "actions";

            if (item.status === "pending") {

                const verify =
                    document.createElement("button");

                verify.textContent =
                    "Verify";

                verify.className =
                    "verify";

                verify.onclick = () =>
                    updateStatus(
                        item.id,
                        "verified"
                    );

                const reject =
                    document.createElement("button");

                reject.textContent =
                    "Reject";

                reject.className =
                    "reject";

                reject.onclick = () =>
                    updateStatus(
                        item.id,
                        "rejected"
                    );

                actions.appendChild(verify);
                actions.appendChild(reject);

            } else {

                actions.textContent =
                    "ดำเนินการแล้ว";
            }

            row.appendChild(id);
            row.appendChild(voucher);
            row.appendChild(status);
            row.appendChild(date);
            row.appendChild(actions);

            list.appendChild(row);
        });

    } catch (error) {

        console.error(
            "โหลดรายการไม่สำเร็จ:",
            error
        );

        list.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    โหลดข้อมูลไม่สำเร็จ:
                    ${error.message}
                </td>
            </tr>
        `;
    }
}

async function updateStatus(id, status) {

    const text =
        status === "verified"
            ? "ยืนยันรายการนี้?"
            : "ปฏิเสธรายการนี้?";

    if (!confirm(text)) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/api/admin/vouchers/${id}`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type": "application/json",
                    "x-admin-token": token
                },

                body: JSON.stringify({
                    status: status
                })
            }
        );

        if (response.status === 401) {

            localStorage.removeItem(
                "adminToken"
            );

            window.location.href =
                "admin-login.html";

            return;
        }

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                `HTTP ${response.status}`
            );
        }

        await loadVouchers();

    } catch (error) {

        alert(
            "เปลี่ยนสถานะไม่สำเร็จ: " +
            error.message
        );
    }
}

function logout() {

    localStorage.removeItem(
        "adminToken"
    );

    window.location.href =
        "admin-login.html";
}

loadVouchers();

</script>

</body>
</html>
