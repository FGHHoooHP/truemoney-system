<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<style>
body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    padding: 30px;
}

h1 {
    margin-bottom: 20px;
}

button {
    padding: 10px 16px;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    background: #e53935;
    color: white;
}

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
    background: #111;
    border-radius: 12px;
    overflow: hidden;
}

th, td {
    padding: 14px;
    border-bottom: 1px solid #222;
    text-align: left;
}

th {
    background: #181818;
}

.status {
    color: #00e676;
}
</style>
</head>

<body>

<h1>Admin Panel</h1>

<button onclick="logout()">Logout</button>

<table>
<thead>
<tr>
    <th>ID</th>
    <th>Voucher</th>
    <th>Status</th>
    <th>Date</th>
</tr>
</thead>

<tbody id="list">
<tr>
    <td colspan="4">กำลังโหลด...</td>
</tr>
</tbody>

</table>

<script>

const API =
"https://truemoney-system-production.up.railway.app";

const token =
localStorage.getItem("adminToken");

if (!token) {
    window.location.href = "admin-login.html";
}

async function loadVouchers() {
    if (!token) return;

    const list = document.getElementById("list");

    try {
        const response = await fetch(
            `${API}/api/admin/vouchers`,
            {
                headers: {
                    "x-admin-token": token
                }
            }
        );

        if (response.status === 401) {
            localStorage.removeItem("adminToken");
            window.location.href = "admin-login.html";
            return;
        }

        if (!response.ok) {
            throw new Error(`Server ตอบกลับ HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.success || !Array.isArray(data.vouchers)) {
            throw new Error(data.message || "รูปแบบข้อมูลไม่ถูกต้อง");
        }

        list.replaceChildren();

        if (data.vouchers.length === 0) {
            list.innerHTML =
                '<tr><td colspan="4">ยังไม่มีรายการ</td></tr>';
            return;
        }

        data.vouchers.forEach(item => {
            const row = document.createElement("tr");

            const values = [
                item.id,
                item.voucher,
                item.status,
                item.created_at
            ];

            values.forEach((value, index) => {
                const cell = document.createElement("td");
                cell.textContent = String(value ?? "");

                if (index === 2) {
                    cell.className = "status";
                }

                row.appendChild(cell);
            });

            list.appendChild(row);
        });

    } catch (error) {
        console.error("โหลดรายการไม่สำเร็จ:", error);

        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 4;
        cell.textContent =
            `โหลดข้อมูลไม่สำเร็จ: ${error.message}`;

        row.appendChild(cell);
        list.replaceChildren(row);
    }
}

function logout() {

    localStorage.removeItem("adminToken");

    window.location.href =
        "admin-login.html";
}

loadVouchers();

</script>

</body>
</html>
