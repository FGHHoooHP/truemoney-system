<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #090909;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .card {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .count {
            font-size: 30px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #292929;
            text-align: left;
        }

        th {
            color: #aaa;
        }

        .status {
            color: #ffaa00;
        }

        .voucher {
            word-break: break-all;
        }

        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            background: #ff7900;
            color: white;
            font-weight: bold;
        }

        .logout {
            float: right;
            background: #333;
        }

        .error {
            color: #ff4444;
        }
    </style>
</head>

<body>

    <button class="logout" onclick="logout()">
        Logout
    </button>

    <h1>Admin Dashboard</h1>

    <div class="card">
        <div>Total Vouchers</div>
        <div class="count" id="count">0</div>
    </div>

    <div class="card">

        <button onclick="loadVouchers()">
            Refresh
        </button>

        <br><br>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Voucher</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody id="voucherList">
            </tbody>
        </table>

    </div>

<script>

const token = localStorage.getItem("adminToken");

if (!token) {
    window.location.href = "admin-login.html";
}

async function loadVouchers() {

    try {

        const response = await fetch(
            "https://truemoney-system-production.up.railway.app/api/admin/vouchers",
            {
                method: "GET",

                headers: {
                    "x-admin-token": token
                }
            }
        );

        if (response.status === 401) {

            localStorage.removeItem("adminToken");

            window.location.href = "admin-login.html";

            return;
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.message);
        }

        document.getElementById("count").textContent =
            data.count;

        const list =
            document.getElementById("voucherList");

        list.innerHTML = "";

        if (data.vouchers.length === 0) {

            list.innerHTML = `
                <tr>
                    <td colspan="4">
                        ยังไม่มีรายการ
                    </td>
                </tr>
            `;

            return;
        }

        data.vouchers.forEach(item => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${escapeHtml(String(item.id))}</td>

                <td class="voucher">
                    ${escapeHtml(item.voucher)}
                </td>

                <td class="status">
                    ${escapeHtml(item.status)}
                </td>

                <td>
                    ${new Date(item.created_at).toLocaleString()}
                </td>
            `;

            list.appendChild(row);

        });

    } catch (error) {

        console.error(error);

        document.getElementById("voucherList").innerHTML = `
            <tr>
                <td colspan="4" class="error">
                    ${escapeHtml(error.message || "Cannot connect to backend")}
                </td>
            </tr>
        `;

    }
}

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

function logout() {

    localStorage.removeItem("adminToken");

    window.location.href = "admin-login.html";
}

loadVouchers();

</script>

</body>
</html>
