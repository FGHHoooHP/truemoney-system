<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.box {
    width: 320px;
    padding: 30px;
    background: #111;
    border-radius: 18px;
    text-align: center;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin: 15px 0;
    border: 0;
    border-radius: 10px;
    background: #222;
    color: white;
}

button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: #00c853;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#message {
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="box">
    <h2>Admin Login</h2>

    <input
        id="password"
        type="password"
        placeholder="Admin Password"
    >

    <button onclick="login()">LOGIN</button>

    <div id="message"></div>
</div>

<script>
async function login() {

    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (!password) {
        message.textContent = "กรุณาใส่รหัสผ่าน";
        return;
    }

    try {

        const response = await fetch(
            "https://truemoney-system-production.up.railway.app/api/admin/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    password: password
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            localStorage.setItem(
                "adminToken",
                data.token
            );

            window.location.href = "admin.html";

        } else {

            message.textContent =
                data.message || "เข้าสู่ระบบไม่สำเร็จ";
        }

    } catch (error) {

        message.textContent =
            "ไม่สามารถเชื่อมต่อ Server ได้";
    }
}
</script>

</body>
</html>
