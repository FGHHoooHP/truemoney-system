<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090909;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 350px;
            padding: 30px;
            background: #151515;
            border-radius: 18px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            box-sizing: border-box;
            border-radius: 10px;
            border: 1px solid #333;
            background: #0d0d0d;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 0;
            border-radius: 10px;
            background: #ff7900;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #result {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Admin Login</h1>

    <input
        id="password"
        type="password"
        placeholder="Admin Password"
    >

    <button onclick="login()">
        Login
    </button>

    <div id="result"></div>

</div>

<script>

async function login() {

    const password =
        document.getElementById("password").value;

    const result =
        document.getElementById("result");

    try {

        const response = await fetch(
            "https://truemoney-system-production.up.railway.app/api/admin/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!data.success) {

            result.textContent = data.message;
            result.style.color = "red";

            return;
        }

        localStorage.setItem(
            "adminToken",
            data.token
        );

        window.location.href = "admin.html";

    } catch (error) {

        result.textContent =
            "เชื่อมต่อ Backend ไม่สำเร็จ";

        result.style.color = "red";

    }

}

</script>

</body>
</html>
